name: Integrated V3 200 MHz matched receiver acceptance
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v3_integrated.yml]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(pwd,'mu_mimo','v2_mimo');v4ReceiverSelfTest;checks=runtests({'v2_mimo/tests/testV2Core.m','v2_mimo/tests/testV3Receiver.m'});assertSuccess(checks);
  diagnose:
    needs: smoke
    if: ${{ !contains(github.event.head_commit.message, '[full-evaluation]') && !contains(github.event.head_commit.message, '[calibrate]') && !contains(github.event.head_commit.message, '[pilot-audit]') }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline, delay300, delay30, static, sounding35, quietRF, perfectTX, perfectTiming, fftEnd, operatingPoint, idealWaveform]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: v2_probe_physics("${{ matrix.scenario }}",32,264,2,"ZF");
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: physics-diagnostic-${{ matrix.scenario }}
          path: physics_diagnostic/
          if-no-files-found: warn
  pilot-audit:
    needs: smoke
    if: ${{ contains(github.event.head_commit.message, '[pilot-audit]') }}
    strategy:
      fail-fast: false
      matrix:
        precoder: [ZF, PZF, MR]
        width: [1, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: calibration-${{ matrix.precoder }}
          run-id: 43067534428
          github-token: ${{ github.token }}
          path: pilot_calibration
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: v2_probe_physics("pilotSlot${{ matrix.width }}",32,264,2,"${{ matrix.precoder }}");
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pilot-audit-${{ matrix.precoder }}-${{ matrix.width }}
          path: physics_diagnostic/
          if-no-files-found: warn
  calibrate:
    needs: smoke
    if: ${{ contains(github.event.head_commit.message, '[calibrate]') }}
    strategy:
      fail-fast: false
      matrix:
        precoder: [ZF, PZF, MR]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run_v4_train_pzf('integrated_receiver',true,'v3_refined/v3_model.mat',128,32,10,"${{ matrix.precoder }}");for bs=[32 64],o=struct('Precoder',"${{ matrix.precoder }}",'RetryModes',["None" "APP50"],'Methods',["LS on common packet" "LMMSE" "Aligned LMMSE" "Aligned CNN" "Perfect CSIR"],'AlignedModel',fullfile('integrated_receiver',lower("${{ matrix.precoder }}")+"_receiver.mat"),'NumRB',264);run_v3_mimo(bs,2,fullfile('calibration_measurement',"BS"+bs),[30 40],99500000,'v3_refined/v3_model.mat',[],o);end
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: calibration-${{ matrix.precoder }}
          path: |
            integrated_receiver/
            calibration_measurement/
          if-no-files-found: warn
  train:
    if: ${{ contains(github.event.head_commit.message, '[full-evaluation]') }}
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        precoder: [ZF, PZF, MR]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run_v4_train_pzf('integrated_receiver',true,'v3_refined/v3_model.mat',128,32,10,"${{ matrix.precoder }}");
      - uses: actions/upload-artifact@v7
        with:
          name: v3-integrated-receiver-${{ matrix.precoder }}
          path: integrated_receiver/
          if-no-files-found: error
  validation:
    needs: train
    strategy:
      fail-fast: false
      matrix:
        precoder: [ZF, PZF, MR]
        antennas: [32, 64]
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: actions/download-artifact@v8
        with:
          name: v3-integrated-receiver-${{ matrix.precoder }}
          path: integrated_receiver
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run_v3_integrated("${{ matrix.precoder }}",${{ matrix.antennas }},${{ matrix.batch }},"validation",264);
      - uses: actions/upload-artifact@v7
        with:
          name: integrated-validation-${{ matrix.precoder }}-${{ matrix.antennas }}-${{ matrix.batch }}
          path: integrated_measurement/
          if-no-files-found: error
  freeze:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: integrated-validation-*
          path: validation
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy pandas matplotlib scipy
          python tools/v3_integrated_analysis.py freeze validation integrated_selection/selection.json --rb 264 --channel-profile mobile
      - uses: actions/upload-artifact@v7
        with:
          name: integrated-selection
          path: integrated_selection/
          if-no-files-found: error
  evaluate:
    needs: freeze
    if: ${{ !cancelled() && needs.freeze.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        precoder: [ZF, PZF, MR]
        antennas: [32, 64]
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: integrated-selection
          path: integrated_selection
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: actions/download-artifact@v8
        with:
          name: v3-integrated-receiver-${{ matrix.precoder }}
          path: integrated_receiver
          github-token: ${{ github.token }}
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run_v3_integrated("${{ matrix.precoder }}",${{ matrix.antennas }},${{ matrix.batch }},"test",264);
      - uses: actions/upload-artifact@v7
        with:
          name: integrated-test-${{ matrix.precoder }}-${{ matrix.antennas }}-${{ matrix.batch }}
          path: integrated_measurement/
          if-no-files-found: error
  review:
    needs: evaluate
    if: ${{ !cancelled() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: integrated-selection
          path: integrated_selection
      - uses: actions/download-artifact@v8
        with:
          pattern: integrated-test-*
          path: integrated_tests
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy pandas matplotlib scipy
          python tools/v3_integrated_analysis.py review integrated_tests integrated_selection/selection.json integrated_review --rb 264 --channel-profile mobile
      - uses: actions/upload-artifact@v7
        with:
          name: V3-Integrated-Results
          path: integrated_review/figures/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: V3-Integrated-Audit
          path: |
            integrated_review/metrics.csv
            integrated_review/paired_user_blocks.csv
            integrated_review/summary.json
          if-no-files-found: error
