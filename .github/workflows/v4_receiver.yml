name: PZF soft receiver ablation
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v4_receiver.yml]
permissions:
  contents: read
  actions: read
jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        antennas: [32, 64]
        batch: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(pwd,'mu_mimo','v2_mimo');v4ReceiverSelfTest;run_v4_pzf(${{ matrix.antennas }},4,'v4_receiver',[0 4 8 12 16 20],71000000+${{ matrix.batch }}*100000,'v3_refined/v3_model.mat',["None" "LBP50" "APP20" "CSI-APP20" "CSI-APP50"],["LS" "LMMSE" "V3 CNN"]);
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v4-receiver-${{ matrix.antennas }}-${{ matrix.batch }}
          path: v4_receiver/
          if-no-files-found: error
