name: Independent channel seeds for BER batch six
on:
  push:
    branches: [practical-hbf-receiver]
    paths: [.github/workflows/independent_hbf_batch.yml]
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 78d948298020a8b791099ea82f57a7a2be5bd238
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 41820206097
          name: frozen-receiver-${{ matrix.array }}
          path: models
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: code1233_link(512,16,"results",${{ matrix.array }},[0:.5:10 11:20],25000,ModelFile="models/receiver_${{ matrix.array }}.mat");
      - uses: actions/upload-artifact@v7
        with:
          name: independent-practical-hbf-${{ matrix.array }}-batch-5
          path: results/
          if-no-files-found: error
