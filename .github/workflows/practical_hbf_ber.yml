name: Practical HBF 512-QAM BER
# Version 3: train covariance in the CFO-compensated receiver frame.
on:
  workflow_dispatch:
  push:
    branches: [practical-hbf-receiver]
    paths:
      - .github/workflows/practical_hbf_ber.yml
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests
      - uses: matlab-actions/run-command@v3
        with:
          command: mkdir('models'); code1233_link(512,1,"training",${{ matrix.array }},0,0,Mode="train",ModelFile="models/receiver_${{ matrix.array }}.mat");
      - uses: actions/upload-artifact@v7
        with:
          name: frozen-receiver-${{ matrix.array }}
          path: models/
          if-no-files-found: error
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
        batch: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: frozen-receiver-${{ matrix.array }}
          path: models
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: code1233_link(512,16,"results",${{ matrix.array }},[0:.5:10 11:20],5000+1000*${{ matrix.batch }}+15000*(${{ matrix.batch }}==5),ModelFile="models/receiver_${{ matrix.array }}.mat");
      - uses: actions/upload-artifact@v7
        with:
          name: practical-hbf-${{ matrix.array }}-batch-${{ matrix.batch }}
          path: results/
          if-no-files-found: error
  external:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: frozen-receiver-${{ matrix.array }}
          path: models
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 41817163511
          name: deepmimo-held-out-rays
          path: external
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: code1233_link(512,32,"results",${{ matrix.array }},[0:.5:10 11:20],85000+1000*${{ matrix.batch }},ModelFile="models/receiver_${{ matrix.array }}.mat",TestProfile="DeepMIMO",RayFile="external/deepmimo_i2_28b.mat",RayStart=1+32*${{ matrix.batch }});
      - uses: actions/upload-artifact@v7
        with:
          name: deepmimo-ber-${{ matrix.array }}-batch-${{ matrix.batch }}
          path: results/
          if-no-files-found: error
  refine:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
        batch: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: frozen-receiver-${{ matrix.array }}
          path: models
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: code1233_link(512,16,"results",${{ matrix.array }},[3:.5:10 11 12],150000+1000*${{ matrix.batch }},ModelFile="models/receiver_${{ matrix.array }}.mat");
      - uses: actions/upload-artifact@v7
        with:
          name: refine-practical-hbf-${{ matrix.array }}-batch-${{ matrix.batch }}
          path: results/
          if-no-files-found: error
