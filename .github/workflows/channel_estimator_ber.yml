name: Compare channel estimators by post-LDPC BER
on:
  workflow_dispatch:
  push:
    branches: [channel-estimator-ber]
    paths:
      - code1233_link.m
      - .github/workflows/channel_estimator_ber.yml
permissions:
  contents: read
jobs:
  simulate:
    name: ${{ matrix.qam }}-QAM config ${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        qam: [256, 512]
        config: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: code1233_link(${{ matrix.qam }},64,"results",${{ matrix.config }});
      - uses: actions/upload-artifact@v7
        with:
          name: estimator-ber-${{ matrix.qam }}-config-${{ matrix.config }}
          path: results/
          if-no-files-found: error
