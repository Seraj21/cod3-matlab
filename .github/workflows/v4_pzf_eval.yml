name: Independent PZF payload selection
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v4_pzf_eval.yml]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        antennas: [32, 64]
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v4-common-receiver
          run-id: 42000390625
          github-token: ${{ github.token }}
          path: receiver_choice
      - uses: actions/download-artifact@v8
        with:
          pattern: v4-pzf-*
          run-id: 41999639429
          github-token: ${{ github.token }}
          path: models
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run_v4_frozen_pzf(${{ matrix.antennas }},${{ matrix.batch }},"validation");
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v4-payload-validation-${{ matrix.antennas }}-${{ matrix.batch }}
          path: v4_measurement/
          if-no-files-found: error
  freeze:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v4-common-receiver
          run-id: 42000390625
          github-token: ${{ github.token }}
          path: receiver_choice
      - uses: actions/download-artifact@v8
        with:
          pattern: v4-payload-validation-*
          path: payload_validation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy pandas matplotlib
          python tools/v4_pzf_analysis.py select payload_validation receiver_choice/receiver.json frozen_choice/pzf_selection.json
      - uses: actions/upload-artifact@v7
        with:
          name: v4-frozen-choice
          path: frozen_choice/
          if-no-files-found: error
