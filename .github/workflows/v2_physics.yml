name: V2 physical reference validation
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v2_physics.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: v2_probe_physics;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v2-physical-reference
          path: v2_physics.csv
          if-no-files-found: warn
