name: V2 independent phase-only algorithm and Manopt controls
# Use a noninteractive Manopt path; no installation prompt in batch MATLAB.
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v2_phase_diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        antennas: [32, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NicolasBoumal/manopt
          ref: 6c369671d8834aa28f7e222c7d89c5f216e6953d
          path: external_manopt
      - uses: actions/download-artifact@v8
        with:
          name: v2-frozen-model
          run-id: 41908344154
          github-token: ${{ github.token }}
          path: v2_frozen
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: results=runtests('v2_mimo/tests/testV2RobustPhase.m');assertSuccess(results);v2_phase_diagnostics(${{ matrix.antennas }});
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v2-phase-control-${{ matrix.antennas }}
          path: |
            v2_phase_diagnostics.csv
            v2_phase_manopt.csv
          if-no-files-found: warn
