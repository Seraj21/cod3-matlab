name: Test LDPC redundancy under fixed hard TDL-C
on:
  push:
    branches: [mu-downlink-tdlc]
    paths: [.github/workflows/mu_rate_probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Seraj21/cod3-matlab
    steps:
      - uses: actions/checkout@v7
      - run: gh run download 41841619172 --name mu-frozen-model --dir models
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: mu_rate_probe;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mu-ldpc-rate-probe
          path: rate_probe.csv
