name: Check BER model
on:
  push:
    branches: [ber-diagnostics]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox
          cache: true
      - uses: matlab-actions/run-command@v3
        with:
          command: check_ber
