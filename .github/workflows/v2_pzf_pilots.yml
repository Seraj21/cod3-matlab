name: V2 quantized-precoder pilot consistency control
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v2_pzf_pilots.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v2-frozen-model
          run-id: 41908344154
          github-token: ${{ github.token }}
          path: v2_frozen
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: results=runtests('v2_mimo/tests/testV2RobustPhase.m');assertSuccess(results);v2_pzf_pilot_control;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v2-pzf-pilot-control
          path: v2_pzf_pilot_control.csv
          if-no-files-found: warn
