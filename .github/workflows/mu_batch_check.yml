name: Check completed MU batch data
on:
  push:
    branches: [mu-downlink-tdlc]
    paths: [.github/workflows/mu_batch_check.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Seraj21/cod3-matlab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy matplotlib
      - name: Download the first completed independent batches
        shell: python
        run: |
          import pathlib,subprocess
          root=pathlib.Path("completed");root.mkdir()
          for aid,name in [(13337685277,"mu-32-batch-3.zip"),(13336389277,"mu-64-batch-5.zip")]:
              with (root/name).open("wb") as out:
                  subprocess.run(["gh","api",f"repos/Seraj21/cod3-matlab/actions/artifacts/{aid}/zip"],stdout=out,check=True)
      - name: Validate count reconstruction before full aggregation
        shell: python
        run: |
          import sys,pathlib,json
          sys.path.insert(0,"tools")
          from analyze_mu import *
          fingerprints=[]
          summaries=[]
          for array,batch in [(32,3),(64,5)]:
              e,f,h=read_batch(pathlib.Path(f"completed/mu-{array}-batch-{batch}.zip"),array)
              fingerprints.append(h)
              for p,precoder in enumerate(PRECODERS):
                  for m,estimator in enumerate(ESTIMATORS):
                      errors=int(e[:,-1,p,m,:].sum())
                      correct=int(((e[:,-1,p,m,:]==0)&~f[:,-1,p,m,:]).sum())
                      summaries.append(dict(BS=array,Precoder=precoder,Estimator=estimator,SNR=20,PayloadBits=N*U*A,Errors=errors,BER=errors/(N*U*A),CorrectBlocks=correct,Goodput=correct*A/(N*T)/1e6))
          assert fingerprints[0]==fingerprints[1]
          print("MU_BATCH_CHECK_BEGIN")
          print(json.dumps(summaries))
          print("MU_BATCH_CHECK_END")
          pathlib.Path("batch_check.json").write_text(json.dumps(summaries,indent=2))
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mu-count-reconstruction-check
          path: batch_check.json
