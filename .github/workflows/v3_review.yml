name: V3 final reproducible results review
# Accept only the completed original half-rate batches plus the verified exact-seed recovery.
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v3_review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scientific audit and plotting libraries
        run: python -m pip install numpy scipy matplotlib pillow
      - name: Verify raw measurements and generate all reviewed figures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/review_v3_ci.py
      - uses: actions/upload-artifact@v7
        with:
          name: MU-V3-Reviewed-Results
          path: reviewed_v3/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: MU-V2-LDPC-Half-Results
          path: reviewed_half/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: MU-V2-LDPC-Eighth-Results
          path: reviewed_eighth/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: MU-V3-Review-Metadata
          path: review_metadata.json
          retention-days: 90
          if-no-files-found: error
