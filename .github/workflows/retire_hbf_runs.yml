name: Retire superseded HBF runs
on:
  push:
    branches: [practical-hbf-receiver]
    paths: [.github/workflows/retire_hbf_runs.yml]
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const obsolete = [
              [41817018020, "2a7f5961232f1a06490ca0b81a8d30beb0122034"],
              [41817478370, "1ea36d227615a728edde8c9fb8220edc7b7b2d84"],
              [41819338337, "7dfeb3a0c455a47036256b4752548154899760b0"]
            ];
            for (const [run_id, sha] of obsolete) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.head_sha !== sha) throw new Error("Unexpected source SHA");
              if (run.status !== "completed") {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id});
                core.info("Cancelled superseded run " + run_id);
              }
            }
