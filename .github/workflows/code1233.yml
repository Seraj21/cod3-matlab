name: Run code1233 in MATLAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - code1233.m
      - .github/workflows/code1233.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: >
            code1233;
            exportgraphics(findobj(groot, 'Type', 'figure', 'Name', 'Hybrid Beamforming BER'), 'BER_vs_SNR.png', 'Resolution', 200);
            exportgraphics(findobj(groot, 'Type', 'figure', 'Name', 'Hybrid Beamforming SE'), 'SE_vs_SNR.png', 'Resolution', 200);
            save('code1233_results.mat', 'ber_results', 'thr_results', 'se_results', 'snr_db_range', 'configs_matrix', 'config_names');
      - uses: actions/upload-artifact@v7
        with:
          name: code1233-results
          path: |
            BER_vs_SNR.png
            SE_vs_SNR.png
            code1233_results.mat
          if-no-files-found: error
