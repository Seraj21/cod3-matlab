name: V2 independent modulation coding and MMSE references
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v2_references.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: v2_reference_checks;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v2-reference-audit
          path: v2_reference/
