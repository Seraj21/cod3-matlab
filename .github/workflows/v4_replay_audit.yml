name: Same-run V3 baseline and phase-noise replay audit
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v4_replay_audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        antennas: [32, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v3-refined-frozen-model
          run-id: 41946464299
          github-token: ${{ github.token }}
          path: v3_refined
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run_v4_replay(${{ matrix.antennas }},'v4_replay_audit');
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v4-replay-audit-${{ matrix.antennas }}
          path: v4_replay_audit/
          if-no-files-found: error
