name: Dense 0-20 dB post-LDPC BER
on:
  workflow_dispatch:
  push:
    branches: [ber-snr-validation]
    paths:
      - code1233_link.m
      - tests/testReceiverAssumptions.m
      - .github/workflows/ber_snr_validation.yml
permissions:
  contents: read
jobs:
  simulate:
    name: Dense ${{ matrix.array }}x${{ matrix.array }} batch ${{ matrix.batch }}
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
        batch: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          select-by-folder: tests
      - uses: matlab-actions/run-command@v3
        with:
          command: checkcode('code1233_link.m','-id'); code1233_link(512,32,"results",${{ matrix.array }},[0:0.5:10,11:20],200+1000*${{ matrix.batch }});
      - uses: actions/upload-artifact@v7
        with:
          name: dense-ber-${{ matrix.array }}x${{ matrix.array }}-batch-${{ matrix.batch }}
          path: results/
          if-no-files-found: error
