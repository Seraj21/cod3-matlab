name: V2 pilot and precoder consistency
on:
  push:
    branches: [mu-cnn-v2]
    paths: [.github/workflows/v2_pilots.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v2-transmitter-model
          run-id: 41905811099
          github-token: ${{ github.token }}
          path: v2_tx_training
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: v2_pilot_probe;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v2-pilot-consistency
          path: v2_pilot_probe.csv
