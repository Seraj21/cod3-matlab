name: MU delay and precoder bandwidth sensitivity
on:
  push:
    branches: [mu-downlink-tdlc]
    paths: [.github/workflows/mu_sensitivity.yml]
permissions:
  contents: write
  actions: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Seraj21/cod3-matlab
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mu-downlink-tdlc
      - run: gh run download 41841619172 --name mu-frozen-model --dir models
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: mu_sensitivity;
      - name: Record sensitivity measurements
        run: |
          mkdir -p results/mu-sensitivity
          cp sensitivity/precoder_width.csv results/mu-sensitivity/
          cp sensitivity/nominal32/mu_metrics.csv results/mu-sensitivity/nominal32.csv
          cp sensitivity/nominal64/mu_metrics.csv results/mu-sensitivity/nominal64.csv
          git config user.name "Seraj"
          git config user.email "60238838+Seraj21@users.noreply.github.com"
          git pull --ff-only origin mu-downlink-tdlc
          git add results/mu-sensitivity
          git commit -m "Measure delay-spread and precoding-bandwidth effects on decoded payloads"
          git push origin HEAD:mu-downlink-tdlc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mu-sensitivity
          path: sensitivity/
