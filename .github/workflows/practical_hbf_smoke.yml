name: Audit practical hybrid receiver
on:
  push:
    branches: [practical-hbf-receiver]
    paths:
      - "**.m"
      - hybridPrecoder.m
      - hybridCodebook.m
      - tests/testPracticalHybrid.m
      - .github/workflows/practical_hbf_smoke.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          select-by-folder: tests
          source-folder: .
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install deepmimo==4.0.5 scipy
      - name: Inspect external channel scenarios
        run: |
          python - <<'PY'
          import deepmimo as dm, json
          print(dm.search({'bands':['mmW']}))
          PY
  smoke:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: checkcode('code1233_link.m','-id'); code1233_link(512,2,"smoke",${{ matrix.array }},[0 10 20],500,NumRB=12,TrainingSlots=4);
      - uses: actions/upload-artifact@v7
        with:
          name: hbf-smoke-${{ matrix.array }}
          path: smoke/
