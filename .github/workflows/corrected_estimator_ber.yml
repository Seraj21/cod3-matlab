name: Corrected 512-QAM channel estimator BER
on:
  workflow_dispatch:
  push:
    branches: [channel-estimator-corrected]
    paths:
      - code1233_link.m
      - .github/workflows/corrected_estimator_ber.yml
permissions:
  contents: read
jobs:
  simulate:
    name: ${{ matrix.array }}x${{ matrix.array }} 512-QAM
    strategy:
      fail-fast: false
      matrix:
        array: [32, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Communications_Toolbox 5G_Toolbox Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: code1233_link(512,32,"results",${{ matrix.array }});
      - uses: actions/upload-artifact@v7
        with:
          name: corrected-ber-${{ matrix.array }}x${{ matrix.array }}
          path: results/
          if-no-files-found: error
